<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort zurücksetzen – MovieMatch</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#0e1116; --card:#171c24; --accent:#e6b34c; --accent-soft:rgba(230,179,76,.15);
    --text:#e8eaed; --text-dim:#9aa3af; --done:#4cc38a; --border:#2a323e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px 24px;
    max-width:340px; width:100%; }
  h1 { color:var(--accent); font-size:19px; margin-bottom:18px; text-align:center; }
  form { display:flex; flex-direction:column; gap:12px; }
  label { display:flex; flex-direction:column; gap:5px; font-size:13px; color:var(--text-dim); }
  input { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:9px 11px; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
    border-radius:8px; padding:10px; font-size:14px; font-weight:700; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { font-size:13px; text-align:center; min-height:16px; }
  .msg.err { color:#e0655c; }
  .msg.ok { color:var(--done); }
  a { color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1>Neues Passwort festlegen</h1>
  <form id="form">
    <label>Neues Passwort<input type="password" id="password" required minlength="8" autocomplete="new-password"></label>
    <div id="msg" class="msg"></div>
    <button type="submit" id="submit">Passwort speichern</button>
  </form>
  <p style="margin-top:14px; text-align:center; font-size:13px;"><a href="index.html">Zurück zur App</a></p>
</div>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const submitBtn = document.getElementById('submit');

  if (!token) {
    msg.textContent = 'Kein gültiger Link. Fordere einen neuen Zurücksetzen-Link in der App an.';
    msg.className = 'msg err';
    submitBtn.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.textContent = '';
    msg.className = 'msg';
    submitBtn.disabled = true;
    try {
      const res = await fetch('/api/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: document.getElementById('password').value }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error === 'invalid_or_expired_token'
          ? 'Der Link ist ungültig oder abgelaufen. Fordere einen neuen an.'
          : 'Das hat nicht geklappt. Bitte erneut versuchen.');
      }
      msg.textContent = 'Passwort geändert. Du kannst dich jetzt anmelden.';
      msg.className = 'msg ok';
      form.style.display = 'none';
    } catch (err) {
      msg.textContent = err.message;
      msg.className = 'msg err';
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
