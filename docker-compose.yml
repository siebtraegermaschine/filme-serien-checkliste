services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: filme_serien
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
    volumes:
      # Datenbank-Sicherungen (siehe backend/lib/sicherung.js). Eigenes Volume,
      # damit sie ein Neubauen des Images ueberstehen -- ohne das laegen sie im
      # Container und waeren beim naechsten Deploy weg.
      - backup_data:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["prod"] # nur beim Deploy auf dem Hetzner-Server: docker compose --profile prod up -d
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  backup_data:
  caddy_data:
  caddy_config:
