name: Discovery-Katalog erweitern (Filme & Serien ab Bewertung 5.0)

on:
  schedule:
    # Alle 2 Tage um 05:00 UTC -- unabhaengig vom taeglichen Streaming-Ingest
    # (streaming.yml). Bewusst nicht taeglich: dieser Job fragt pro Lauf ca.
    # 26.000 Mal TMDB an (Cast/Regie/Overview je Titel), die zugrunde liegenden
    # Bewertungen/Stimmenzahlen aendern sich aber kaum von Tag zu Tag -- alle 2
    # Tage faengt neu erschienene/neu ueber die Schwelle steigende Titel zeitnah
    # ein, ohne taeglich fast identische Daten neu abzufragen.
    - cron: "0 5 */2 * *"
  workflow_dispatch:            # erlaubt manuelles Ausloesen im Actions-Tab

concurrency:
  group: rated-titles-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Seit Absenkung der Schwelle auf Bewertung>=5/Stimmen>=100 (vorher 6.0/1000)
    # ist die Titelmenge von ca. 4.800 auf ca. 26.000 gestiegen (~5.5x) --
    # entsprechend hochgesetzt gegenueber den vorherigen 120 Minuten.
    timeout-minutes: 300
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Discovery-Katalog aktualisieren
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAMING_API_URL: ${{ vars.STREAMING_API_URL }}
          TITLES_INGEST_SECRET: ${{ secrets.TITLES_INGEST_SECRET }}
          # Optional konfigurierbar:
          # RATED_MIN_RATING: "5"
          # RATED_MIN_VOTES: "100"
        run: node discover-rated-titles.mjs
