name: Sport-Daten aktualisieren

on:
  # ---- Zeitplan abgeschaltet (Christian, 25.08.2026) ----
  # CouchUltras ist am 24.08.2026 ausgezogen (eigenes Repo, eigener Container,
  # eigene Datenbank -- UEBERGABE-OFFEN.md 0.0.0.0.0.0) und crawlt seitdem
  # selbst. Dieser Workflow lief danach unbemerkt weiter und schrieb in die
  # MovieTaste-Datenbank: Am 25.08. um 05:21 UTC schrieb CouchUltras, um 05:30
  # dieser hier -- zweimal OpenLigaDB fuer Daten, die hier niemand mehr liest.
  #
  # Nur die Ausloeser sind weg, nicht der Workflow: Solange der Sportcode hier
  # liegt, ist der Rueckweg eine Zeile im Caddyfile -- dann sollen auch die
  # Daten wieder einlaufen koennen. Zum Wiedereinschalten die beiden cron- und
  # den push-Block unten entkommentieren. Von Hand ausloesen geht weiterhin.
  #
  #  schedule:
  #    - cron: "0 5,11,17 * * *"
  #    - cron: "0 14,20 * * 5,6,0"
  #  push:
  #    branches: [main]
  #    paths: ["sport-rechte.json", "sport-fetch.mjs", "backend/lib/sportRechte.js"]
  workflow_dispatch: {}         # erlaubt manuelles Ausloesen im Actions-Tab

concurrency:
  group: sport-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sport-Daten aktualisieren
        env:
          STREAMING_API_URL: ${{ vars.STREAMING_API_URL }}
          # Bewusst DASSELBE Secret wie beim Kino: gleiche Vertrauensstufe
          # (GitHub Action -> Backend), und der Server braucht kein neues
          # Secret in backend/.env (routes/sport.js faellt auf
          # CINEMA_INGEST_SECRET zurueck, wenn SPORT_INGEST_SECRET fehlt).
          SPORT_INGEST_SECRET: ${{ secrets.CINEMA_INGEST_SECRET }}
        run: node sport-fetch.mjs
