name: Streaming-Daten aktualisieren

on:
  schedule:
    # ALLE 41 Regionen TAEGLICH in einer Kette, Start 20:00 UTC (22 Uhr MESZ),
    # DE zuerst -- Europa ist damit zum Morgen frisch.
    #
    # Das geht seit der Skip-Liste (GET /api/streaming/enriched, siehe
    # stream-fetch.mjs): Titel-Details (Besetzung, Regie, Freigaben,
    # Uebersetzungen) sind sprachneutral und werden nur noch geholt, wenn die
    # Anreicherung in der Datenbank aelter als 7 Tage ist -- sonst schickt der
    # Lauf nur die regionsspezifische Verfuegbarkeit. Ein Regionen-Lauf ohne
    # Detail-Abrufe braucht damit im Wesentlichen nur noch das discover-Paging:
    # gemessen 7 min 50 s (AT, 21.986 Titel, alle uebersprungen, 12. August
    # 2026) statt vorher 57-87 Minuten (DE 87 min, AT 58 min, gleicher Tag,
    # vor der Skip-Liste). Laeuft die Anreicherung
    # ab (alle ~7 Tage), holt sie der ERSTE Lauf der Kette (DE) einmal neu und
    # dauert dann wieder ~1-1,5 h; die uebrigen 40 Regionen desselben Tages
    # sehen die frischen Zeitstempel und bleiben schnell. Erwartete Kettenzeit:
    # ~4-7 h an normalen Tagen, am woechentlichen Auffrisch-Tag entsprechend
    # laenger. Die fruehere Gruppen-Rotation (B-E im Vier-Tage-Wechsel) ist
    # damit hinfaellig.
    - cron: "0 20 * * *"
  workflow_dispatch:            # erlaubt manuelles Auslösen im Actions-Tab
    inputs:
      regionen:
        description: "Kommagetrennte Regionen (leer = alle 41)"
        required: false
        default: ""

permissions:
  contents: write               # nötig, damit die Action streaming.json committen darf

concurrency:
  group: streaming-update
  cancel-in-progress: false

jobs:
  # Bestimmt, welche Regionen DIESER Lauf abarbeitet: alle 41 (Reihenfolge und
  # Umfang muessen zu REGIONEN in backend/lib/i18n.js passen, DE zuerst) --
  # oder die von Hand eingegebene Liste beim manuellen Ausloesen.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regionen: ${{ steps.wahl.outputs.regionen }}
    steps:
      - name: Regionen dieses Laufs bestimmen
        id: wahl
        env:
          EINGABE: ${{ github.event.inputs.regionen }}
        run: |
          ALLE='["DE","AT","CH","GB","FR","IT","ES","NL","PT","PL","DK","SE","NO","FI","BE","IE","CZ","GR","HU","RO","BG","HR","SI","SK","LT","LV","EE","LU","MT","CY","US","IS","LI","CA","AU","NZ","MX","AR","CL","CO","BR"]'
          if [ -n "$EINGABE" ]; then
            LISTE=$(echo "$EINGABE" | tr '[:lower:]' '[:upper:]' | tr -d ' ' | \
              awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; print "]"}')
          else
            LISTE="$ALLE"
          fi
          echo "regionen=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Dieser Lauf: $LISTE"

  update:
    needs: plan
    runs-on: ubuntu-latest
    # Ein Lauf je Region (siehe PLAN-INTERNATIONALISIERUNG.md): der Ingest im
    # Backend verwaltet jede Region getrennt. Nacheinander statt parallel
    # (max-parallel), damit sich die Laeufe nicht gegenseitig ins
    # TMDB-Rate-Limit treiben. DE zuerst (der Commit-Schritt unten haengt am
    # DE-Lauf).
    strategy:
      max-parallel: 1
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regionen) }}
    # Normalfall dank Skip-Liste ~8 min je Region; der Spielraum deckt den
    # Auffrisch-Fall ab, wenn ein Lauf die ~22.000 Titel-Details neu holt
    # (gemessen bis 87 min) -- deutlich unter dem GitHub-Actions-Default von
    # 360 Minuten, aber weit weg vom Normalfall.
    timeout-minutes: 240
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: streaming.json erzeugen (und ggf. ans Backend senden)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Sobald der Hetzner-Server live ist: STREAMING_API_URL als Repository-
          # Variable (Settings → Secrets and variables → Actions → Variables) auf
          # die Basis-URL des Backends setzen, z. B. https://filme.example.de
          # Zusätzlich STREAMING_INGEST_SECRET als Repository-Secret anlegen
          # (muss mit backend/.env: STREAMING_INGEST_SECRET übereinstimmen).
          # Solange beides leer ist, wird nur lokal streaming.json geschrieben
          # und wie bisher committet.
          STREAMING_API_URL: ${{ vars.STREAMING_API_URL }}
          STREAMING_INGEST_SECRET: ${{ secrets.STREAMING_INGEST_SECRET }}
          TMDB_REGION: ${{ matrix.region }}
          # Optional konfigurierbar (kein Titel-Deckel mehr -- ohne diese
          # Variablen werden alle aktuell verfuegbaren Titel je Anbieter geholt):
          # STREAM_MIN_VOTES: "300"
          # STREAM_MIN_YEAR: "1980"
        run: node stream-fetch.mjs

      - name: Änderungen committen (nur solange kein Backend angebunden ist)
        # streaming.json traegt nur EINE Region -- committet wird deshalb nur
        # der DE-Lauf, wie bisher.
        if: ${{ !vars.STREAMING_API_URL && matrix.region == 'DE' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain streaming.json | grep -q .; then
            git add streaming.json
            git commit -m "chore: Streaming-Daten aktualisiert ($(date -u +%Y-%m-%d))"
            git push
            echo "streaming.json aktualisiert und gepusht."
          else
            echo "Keine Änderungen an streaming.json."
          fi
