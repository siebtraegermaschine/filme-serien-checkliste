name: Kino-Daten aktualisieren

on:
  schedule:
    # Kino-Laeufe sind schnell (gemessen ~5 min je Region) -- TAEGLICH ALLE
    # Regionen in einer Kette (~3-4 h). 13:30 UTC liegt weit weg von der
    # abendlichen Streaming-Kette (streaming.yml, 20:00 UTC bis in den
    # fruehen Morgen), damit sich die beiden Ketten das TMDB-Kontingent
    # nicht teilen muessen.
    - cron: "30 13 * * *"
  workflow_dispatch:            # erlaubt manuelles Ausloesen im Actions-Tab
    inputs:
      regionen:
        description: "Kommagetrennte Regionen (leer = alle 41)"
        required: false
        default: ""

concurrency:
  group: cinema-update
  cancel-in-progress: false

jobs:
  # Ohne Eingabe alle Regionen (Cron wie Hand-Ausloesung); mit Eingabe die
  # angegebene Liste. Muss zu REGIONEN in backend/lib/i18n.js passen.
  plan:
    runs-on: ubuntu-latest
    outputs:
      regionen: ${{ steps.wahl.outputs.regionen }}
    steps:
      - name: Regionen dieses Laufs bestimmen
        id: wahl
        env:
          EINGABE: ${{ github.event.inputs.regionen }}
        run: |
          ALLE='["DE","AT","CH","GB","FR","IT","ES","NL","PT","PL","DK","SE","NO","FI","BE","IE","CZ","GR","HU","RO","BG","HR","SI","SK","LT","LV","EE","LU","MT","CY","US","IS","LI","CA","AU","NZ","MX","AR","CL","CO","BR"]'
          if [ -n "$EINGABE" ]; then
            LISTE=$(echo "$EINGABE" | tr '[:lower:]' '[:upper:]' | tr -d ' ' | \
              awk -F, '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; print "]"}')
          else
            LISTE="$ALLE"
          fi
          echo "regionen=$LISTE" >> "$GITHUB_OUTPUT"
          echo "Dieser Lauf: $LISTE"

  update:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Ein Lauf je Region -- nacheinander, wegen des TMDB-Rate-Limits (siehe
    # streaming.yml).
    strategy:
      max-parallel: 1
      # Ein Regionsfehler darf die uebrigen nicht abbrechen (am 13. August
      # riss ein MX-Fehlschlag AR/CL/CO per fail-fast-Default mit).
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regionen) }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kino-Daten aktualisieren
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAMING_API_URL: ${{ vars.STREAMING_API_URL }}
          CINEMA_INGEST_SECRET: ${{ secrets.CINEMA_INGEST_SECRET }}
          TMDB_REGION: ${{ matrix.region }}
        run: node cinema-fetch.mjs

  # Gegenstueck zum "nachzuegler" in streaming.yml (754756c): faellt in der
  # Kette eine einzelne Region aus, wird genau sie einmal wiederholt, statt
  # bis zum naechsten Tageslauf auf dem Vortagsstand zu bleiben (so geschehen
  # am 26.08.2026 mit RO, Lauf #37 -- die Kino-Kette hatte den Job noch nicht).
  # Der Gesamtlauf bleibt rot; was nachgeholt wurde, steht in der Summary.
  nachzuegler:
    needs: update
    if: always() && needs.update.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read               # nur zum Lesen der Jobs DIESES Laufs
    timeout-minutes: 60
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gescheiterte Regionen ermitteln
        id: finden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Die Matrix-Jobs heissen "update (RO)" -- daraus das Kuerzel ziehen.
          REGIONEN=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            | jq -r '[.jobs[]
                      | select(.conclusion == "failure")
                      | .name
                      | select(test("^update \\([A-Z]{2}\\)$"))
                      | ltrimstr("update (") | rtrimstr(")")]
                     | unique | join(" ")')
          echo "regionen=$REGIONEN" >> "$GITHUB_OUTPUT"
          echo "Nachzuholen: ${REGIONEN:-(keine erkannt)}"

      - name: Wiederholen
        if: steps.finden.outputs.regionen != ''
        env:
          REGIONEN: ${{ steps.finden.outputs.regionen }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          STREAMING_API_URL: ${{ vars.STREAMING_API_URL }}
          CINEMA_INGEST_SECRET: ${{ secrets.CINEMA_INGEST_SECRET }}
        run: |
          FEHLER=0
          for R in $REGIONEN; do
            echo "──── zweiter Versuch: $R"
            if TMDB_REGION="$R" node cinema-fetch.mjs; then
              echo "- $R: nachgeholt" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $R: **auch im zweiten Versuch gescheitert**" >> "$GITHUB_STEP_SUMMARY"
              FEHLER=1
            fi
          done
          exit $FEHLER
