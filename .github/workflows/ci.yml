name: CI

# Laeuft parallel zum Deploy und blockiert ihn nicht (deploy.yml hat kein
# "needs" darauf). Zweck: Rote Tests sichtbar machen, nicht Deploys sperren.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filme_serien
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/filme_serien
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Abhaengigkeiten
        working-directory: backend
        run: npm ci
      - name: Schema anwenden
        working-directory: backend
        run: npm run migrate
      - name: Tests
        working-directory: backend
        run: npm test
